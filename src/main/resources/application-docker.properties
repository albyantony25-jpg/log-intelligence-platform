# =============================================================================
# Docker profile configuration — active when SPRING_PROFILES_ACTIVE=docker
# =============================================================================
#
# This file overrides only the settings that differ inside a Docker network.
# All other settings (JPA dialect, logging levels, Groq key, etc.) are
# inherited from application.properties.
#
# Key difference from local development:
#   - Local: datasource host = localhost  (PostgreSQL runs on the host machine)
#   - Docker: datasource host = postgres  (the Docker Compose service name,
#             resolved automatically by Docker's internal DNS)
#
# Credentials are injected via environment variables set in docker-compose.yml,
# keeping secrets out of version control.
# =============================================================================

# Spring Boot automatically maps SPRING_DATASOURCE_URL / USERNAME / PASSWORD
# environment variables to these properties, so the explicit ${} references
# below serve as documentation and local fallback defaults only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/log_intelligence}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:loguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:logpassword}

# Hibernate can auto-detect the PostgreSQL dialect — suppress the deprecation
# warning by removing the explicit dialect setting in Docker profile.
spring.jpa.database-platform=

# Reduce SQL logging noise in containerised environments where logs go to
# stdout and are collected by a log aggregator (reduce volume, not silence errors).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
