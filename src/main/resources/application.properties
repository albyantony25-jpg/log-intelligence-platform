# =============================================================================
# Log Intelligence Platform — Application Configuration
# =============================================================================
# Fill in YOUR_* placeholders with your actual PostgreSQL connection details
# before running the application.
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8081
groq.api.key=${GROQ_API_KEY}
# -----------------------------------------------------------------------------
# DataSource — PostgreSQL
# -----------------------------------------------------------------------------
# Format: jdbc:postgresql://<host>:<port>/<database>
spring.datasource.url=jdbc:postgresql://localhost:5432/log_intelligence
spring.datasource.username=postgres
spring.datasource.password=alby2510

# PostgreSQL JDBC driver class (Spring Boot 3 / Hibernate 6)
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
# hibernate.ddl-auto controls schema generation on startup:
#   create-drop  – drop and recreate schema on every startup (development only)
#   update       – apply incremental DDL changes (use with caution in production)
#   validate     – validate schema against entities; fail fast if mismatched
#   none         – do nothing (production recommended; use Flyway/Liquibase instead)
spring.jpa.hibernate.ddl-auto=update

# Show the SQL Hibernate generates in the console (useful for debugging).
# Set to false in production to reduce log noise.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures Hibernate uses the PostgreSQL dialect optimised for Postgres features.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Root log level; adjust as needed (DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO
logging.level.com.logplatform=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# -----------------------------------------------------------------------------
# Groq AI Integration
# -----------------------------------------------------------------------------
# Set the GROQ_API_KEY environment variable before running the app.
# Get a free key at: https://console.groq.com/keys
# The :  (empty default) means the app starts even if the variable is absent;
# GroqService will return "Summary unavailable" for every cluster in that case.
groq.api.key=${GROQ_API_KEY:}

# -----------------------------------------------------------------------------
# Redis — Cache layer for Groq AI summaries
# -----------------------------------------------------------------------------
# Host defaults to localhost for local development.
# Override with REDIS_HOST=redis when running inside Docker Compose.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# 2-second connect timeout — fast failure so Lettuce doesn't block app startup.
spring.data.redis.connect-timeout=2000
# Allow Lettuce to reconnect automatically after a Redis restart.
spring.data.redis.lettuce.pool.enabled=false
