# =============================================================================
# Docker Compose — Log Intelligence Platform
# =============================================================================
#
# Services:
#   postgres  — PostgreSQL 16 database with a named volume for data persistence
#   redis     — Redis 7 (Alpine) for caching Groq AI summaries (1-hour TTL)
#   app       — Spring Boot API built from the project Dockerfile
#
# Usage:
#   export GROQ_API_KEY="gsk_your_key_here"   # Linux/macOS
#   $env:GROQ_API_KEY = "gsk_your_key_here"   # Windows PowerShell
#   docker compose up --build
#
# The --build flag re-builds the app image when source files change.
# Omit it on subsequent runs when code hasn't changed (faster startup).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: log_intelligence_db
    restart: unless-stopped

    environment:
      POSTGRES_DB:       log_intelligence   # database name
      POSTGRES_USER:     loguser            # DB user (used by the app service below)
      POSTGRES_PASSWORD: logpassword        # DB password — change in production

    ports:
      # Expose to host for optional direct inspection with psql / pgAdmin.
      # Remove this mapping in production if external DB access is not needed.
      - "5433:5432"

    volumes:
      # Named volume — data persists across container restarts and re-creations.
      # Run `docker compose down -v` to wipe the database.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # pg_isready exits 0 only when PostgreSQL is fully accepting connections.
      # The app service waits for this before starting (condition: service_healthy).
      test: ["CMD-SHELL", "pg_isready -U loguser -d log_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — Groq AI summary cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: log_intelligence_redis
    restart: unless-stopped

    ports:
      # Expose to host so you can inspect the cache with: redis-cli -p 6380
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      # 'redis-cli ping' returns PONG when Redis is accepting commands.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Spring Boot application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .          # Dockerfile is in the project root
      dockerfile: Dockerfile
    container_name: log_intelligence_app
    restart: unless-stopped

    ports:
      - "8081:8081"       # Maps host:8081 → container:8081

    environment:
      # --- Spring profile activates application-docker.properties ---
      SPRING_PROFILES_ACTIVE: docker

      # --- Database connection (resolves to the postgres service above) ---
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/log_intelligence
      SPRING_DATASOURCE_USERNAME: loguser
      SPRING_DATASOURCE_PASSWORD: logpassword

      # --- Groq AI integration ---
      # Passed through from the host environment — never hard-coded here.
      # The app degrades gracefully to "Summary unavailable" if this is unset.
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      # --- Redis cache (resolves to the redis service name via Docker DNS) ---
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # --- Optional JVM tuning ---
      JAVA_OPTS: "-Xms256m -Xmx512m"

    depends_on:
      postgres:
        # Docker Compose waits for the postgres healthcheck to pass before
        # starting the app container, preventing "Connection refused" errors
        # during the DB connection pool initialisation.
        condition: service_healthy
      redis:
        # Wait for Redis to accept connections before the app starts,
        # so the first @Cacheable call doesn't fail on startup.
        condition: service_healthy

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    # Redis data is persisted across container restarts.
    # Run `docker compose down -v` to clear the cache along with the database.
    driver: local
